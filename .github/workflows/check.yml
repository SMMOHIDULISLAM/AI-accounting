name: Accounting checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm verify:sources
      - run: python -m unittest discover -s third_party/ledger-reborn/tests -v
      - run: python scripts/create-source-example.py /tmp/ai-accounting-source-contract.sqlite
      - run: node --import tsx scripts/verify-source-example.mjs /tmp/ai-accounting-source-contract.sqlite
      - run: pnpm build
      - run: pnpm smoke
  polyglot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python scripts/verify-polyglot.py --native
